<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registre de visites</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6a7385;--bd:#dfe3ea;--ac:#1f6f4a;--acx:#fff;--wa:#b4531a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--card:#1e222b;--tx:#e8ebf0;--mut:#9aa3b5;--bd:#303644;--ac:#4cb887;--acx:#0d1a13;--wa:#e8925a}}
:root[data-theme="dark"]{--bg:#15181e;--card:#1e222b;--tx:#e8ebf0;--mut:#9aa3b5;--bd:#303644;--ac:#4cb887;--acx:#0d1a13;--wa:#e8925a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
input[type=text],input[type=date],input[type=search],input[type=time]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:.92rem;color:var(--tx)}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.s{padding:6px 10px;font-size:.85rem;border-color:var(--wa);color:var(--wa)}
button:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.bar>div{flex:1 1 160px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--ac);color:var(--acx);font-weight:600;font-size:.85rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:.8rem}
td.w{white-space:normal;min-width:140px}
.msg{margin:10px 0 0;font-size:.9rem;color:var(--wa)}
.ok{color:var(--ac)}
.empty{color:var(--mut);padding:16px 0;text-align:center}
.hd{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#fff;color:#1d2330;border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin-bottom:16px}.hd img{height:90px;width:auto;display:block}.hd .t{flex:1 1 220px}.hd .t h1{margin:0 0 4px;color:#1d2330}.hd .t div{font-size:.95rem}.hd .t div b{font-weight:700}
.sg{width:100%;max-width:420px;height:140px;border:1px dashed var(--mut);border-radius:8px;background:#fff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;display:block;cursor:crosshair}td img.sgi{height:34px;background:#fff;border:1px solid var(--bd);border-radius:4px;display:block}
</style>
</head>

      <div><label for="nom">Nom i cognoms *</label><input type="text" id="nom" autocomplete="off"></div>
      <div><label for="emp">Empresa *</label><input type="text" id="emp" autocomplete="off"></div>
      <div><label for="doc">DNI / document</label><input type="text" id="doc" autocomplete="off"></div>
      <div><label for="mot">Motiu de la visita *</label><input type="text" id="mot" autocomplete="off"></div>
      <div><label for="vis">Persona visitada *</label><input type="text" id="vis" autocomplete="off"></div>
      <div><label for="mat">Matrícula (si ve en vehicle)</label><input type="text" id="mat" autocomplete="off"></div>
      <div><label for="hen">Hora d’entrada *</label><input type="time" id="hen"></div>
      <div><label for="hsa">Hora de sortida (opcional)</label><input type="time" id="hsa"></div>
    </div>
    <div style="margin-top:12px">
      <label class="chk"><input type="checkbox" class="dec"><span>He llegit i accepto les normes d’higiene i seguretat alimentària de l’empresa.</span></label>
      <label class="chk"><input type="checkbox" class="dec"><span>No tinc símptomes de malaltia infecciosa (vòmits, diarrea, febre, infeccions de pell) ni he estat en contacte amb algú que els tingui.</span></label>
      <label class="chk"><input type="checkbox" class="dec"><span>No porto joies, rellotge ni objectes personals que puguin caure a la zona de producció.</span></label>
    </div>
    <div style="margin:12px 0"><label>Signatura del visitant *</label><canvas id="sg" class="sg" width="420" height="140"></canvas><button type="button" class="s" id="sgc" style="margin-top:6px">Esborrar signatura</button></div>
    <button class="p" id="reg">Registrar entrada</button>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <section class="card">
    <h2>Visites <span class="pill" id="dins">0 a dins</span></h2>
    <div class="bar">
      <div><label for="dia">Dia</label><input type="date" id="dia"></div>
      <div><label for="q">Cercar</label><input type="search" id="q" placeholder="Nom, empresa…"></div>
      <button id="csv">Exportar CSV</button>
    </div>
    <div class="tw">
      <table>
        <thead><tr><th>Entrada</th><th>Nom</th><th>Empresa</th><th>Motiu</th><th>Visita a</th><th>Matrícula</th><th>Sortida</th><th>Signatura</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>Cap visita registrada aquest dia.</div>
  </section>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var visits=[], db=null, local=false, KEY="visites-brc";
  var pad=function(n){return String(n).padStart(2,"0")};
  var dayOf=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
  var hhmm=function(iso){var d=new Date(iso);return pad(d.getHours())+":"+pad(d.getMinutes())};
  $("dia").value=dayOf(new Date());
  var edited=false;
  function nowT(){return hhmm(new Date().toISOString())}
  $("hen").value=nowT(); $("hen").oninput=function(){edited=true};
  setInterval(function(){if(!edited)$("hen").value=nowT()},30000);
  var cv=$("sg"),cx=cv.getContext("2d"),drawing=false,signed=false;
  cx.lineWidth=2.5;cx.lineCap="round";cx.lineJoin="round";cx.strokeStyle="#111";
  function pos(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]}
  function pt(e){var t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return pos(t)}
  function st(e){e.preventDefault();drawing=true;var p=pt(e);cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(p[0]+.1,p[1]+.1);cx.stroke();signed=true}
  function mv(e){if(!drawing)return;e.preventDefault();var p=pt(e);cx.lineTo(p[0],p[1]);cx.stroke()}
  function en(){drawing=false}
  var po={passive:false};
  if("ontouchstart" in window){cv.addEventListener("touchstart",st,po);cv.addEventListener("touchmove",mv,po);cv.addEventListener("touchend",en,po);cv.addEventListener("touchcancel",en,po)}
  else{cv.addEventListener("mousedown",st);window.addEventListener("mousemove",mv);window.addEventListener("mouseup",en)}
  function clearSig(){cx.clearRect(0,0,cv.width,cv.height);signed=false}
  $("sgc").onclick=clearSig;

  function say(t,ok){var m=$("msg");m.textContent=t;m.className="msg"+(ok?" ok":"")}

  function loadLocal(){try{visits=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){visits=[]}}
  function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(visits))}catch(e){}}

  function render(){
    var d=$("dia").value, q=$("q").value.trim().toLowerCase();
    var list=visits.filter(function(v){
      if(v.dia!==d) return false;
      return !q||[v.nom,v.empresa,v.motiu,v.visita].join(" ").toLowerCase().indexOf(q)>-1;
    }).sort(function(a,b){return a.entrada<b.entrada?-1:1});
    var tb=$("rows"); tb.textContent="";
    list.forEach(function(v){
      var tr=document.createElement("tr");
      var cells=[hhmm(v.entrada),v.nom,v.empresa,v.motiu,v.visita,v.matricula||"–"];
      cells.forEach(function(c,i){var td=document.createElement("td");if(i>=2&&i<=4)td.className="w";td.textContent=c;tr.appendChild(td)});
      var td=document.createElement("td");
      if(v.sortida){td.textContent=hhmm(v.sortida)}
      else{var b=document.createElement("button");b.className="s";b.textContent="Marcar sortida";b.onclick=function(){exit(v)};td.appendChild(b)}
      tr.appendChild(td);
      var ts=document.createElement("td");
      if(typeof v.signatura==="string"&&v.signatura.indexOf("data:image/png")===0){var im=document.createElement("img");im.src=v.signatura;im.className="sgi";im.alt="Signatura";ts.appendChild(im)}else ts.textContent="–";
      tr.appendChild(ts); tb.appendChild(tr);
    });
    $("empty").hidden=list.length>0;
    var dins=visits.filter(function(v){return v.dia===d&&!v.sortida}).length;
    $("dins").textContent=dins+" a dins";
  }

  function exit(v){
    var t=new Date().toISOString();
    if(db){db.collection("visites").doc(v.id).update({sortida:t}).catch(function(){say("No s’ha pogut guardar la sortida.")})}
    else{v.sortida=t;saveLocal();render()}
  }

  $("reg").onclick=function(){
    var f={nom:$("nom").value.trim(),empresa:$("emp").value.trim(),document:$("doc").value.trim(),motiu:$("mot").value.trim(),visita:$("vis").value.trim(),matricula:$("mat").value.trim().toUpperCase()};
    if(!f.nom||!f.empresa||!f.motiu||!f.visita){say("Omple els camps obligatoris (*).");return}
    var all=[].slice.call(document.querySelectorAll(".dec")).every(function(c){return c.checked});
    if(!all){say("Cal acceptar les tres declaracions abans de registrar l’entrada.");return}
    if(!signed){say("Cal la signatura del visitant.");return}
    var now=new Date();
    var mk=function(h){var p=h.split(":"),x=new Date();x.setHours(+p[0],+p[1],0,0);return x};
    var he=$("hen").value, hs=$("hsa").value;
    if(!he){say("Indica l’hora d’entrada.");return}
    var ent=mk(he), sor=hs?mk(hs):null;
    if(sor&&sor<ent){say("L’hora de sortida no pot ser anterior a la d’entrada.");return}
    f.entrada=ent.toISOString(); f.dia=dayOf(ent); f.sortida=sor?sor.toISOString():null; f.declaracions=true; f.signatura=cv.toDataURL("image/png");
    var done=function(){
      ["nom","emp","doc","mot","vis","mat","hsa"].forEach(function(i){$(i).value=""});edited=false;$("hen").value=nowT();clearSig();
      [].forEach.call(document.querySelectorAll(".dec"),function(c){c.checked=false});
      $("dia").value=dayOf(now); say("Entrada registrada a les "+hhmm(f.entrada)+".",true); render();
    };
    if(db){db.collection("visites").add(f).then(done).catch(function(){say("No tens permís per registrar visites en aquesta pàgina.")})}
    else{f.id="l"+Date.now();visits.push(f);saveLocal();done()}
  };

  $("csv").onclick=function(){
    var d=$("dia").value;
    var rows=[["Data","Entrada","Sortida","Nom","Empresa","Document","Motiu","Visita a","Matrícula","Declaracions acceptades","Signada"]];
    visits.filter(function(v){return v.dia===d}).sort(function(a,b){return a.entrada<b.entrada?-1:1}).forEach(function(v){
      rows.push([v.dia,hhmm(v.entrada),v.sortida?hhmm(v.sortida):"",v.nom,v.empresa,v.document||"",v.motiu,v.visita,v.matricula||"","Sí",v.signatura?"Sí":"No"]);
    });
    var txt="\ufeff"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(";")}).join("\r\n");
    var blob=new Blob([txt],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob), l=document.createElement("a");
    l.href=url; l.download="visites-"+d+".csv"; document.body.appendChild(l); l.click();
    setTimeout(function(){URL.revokeObjectURL(url);l.remove()},500);
  };

  $("dia").onchange=render; $("q").oninput=render;

  loadLocal(); render();
})();
</script>
</body>
</html>
